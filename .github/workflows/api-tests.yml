name: Postman Tests

on:
  push:
  workflow_dispatch:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    env:
      COLLECTION: tests/collection.json
      REPORT_FILE: postman-report.html
      BASE_URL: https://dog.ceo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Collection
        continue-on-error: true
        env:
          secret_key: ${{ secrets.api_key }}
        run: |
          newman run "$COLLECTION" \
            -e tests/environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export "$REPORT_FILE" \
            --env-var base_url="$BASE_URL" \
            --env-var secret_key="$secret_key"

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: ${{ env.REPORT_FILE }}
