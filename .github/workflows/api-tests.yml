name: Run Postman Tests

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    env:
      COLLECTION: tests/collection.json
      REPORT_DIR: newman
      REPORT_FILE: newman-report.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmltextra

      - name: Create report directory
        run: mkdir -p $REPORT_DIR

      - name: Run Postman Collection
        run: |
          newman run "$COLLECTION" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export "$REPORT_DIR/$REPORT_FILE"

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: ${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}
