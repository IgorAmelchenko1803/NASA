name: Postman Tests

on:
  push:
  workflow_dispatch:

env:
  COLLECTION: tests/collection.json
  REPORT_DIR: newman
  REPORT_FILE: newman-report.html

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Create report directory
        run: mkdir -p ${{ env.REPORT_DIR }}

      - name: Run Postman tests
        env:
          secret_key: ${{ secrets.api_key }}
        run: |
          newman run "${{ env.COLLECTION }}" \
            --env-var "secret_key=${{ env.secret_key }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export "${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}"

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: ${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}
          if-no-files-found: error
